		<script>
			var Frame = document.getElementById("Frame");
			var deferredInstallPrompt = null;

			function isStandaloneMode() {
				return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
			}

			function notifyUnityInstallHint(message) {
				try {
					if (Frame && Frame.contentWindow && typeof Frame.contentWindow.SendMessage === "function") {
						Frame.contentWindow.SendMessage("GameApp", "OnInstallHint", message || "");
						return true;
					}
				} catch (error) {
					console.warn("notify unity install hint failed", error);
				}
				return false;
			}

			function openInstallFlow() {
				if (deferredInstallPrompt) {
					deferredInstallPrompt.prompt();
					deferredInstallPrompt.userChoice.finally(function() {
						deferredInstallPrompt = null;
					});
					return;
				}

				var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
				if (isIOS && !isStandaloneMode()) {
					notifyUnityInstallHint("Tap browser Share, then choose Add to Home Screen.");
					return;
				}

				notifyUnityInstallHint("This browser does not support one-tap install. Use browser menu to add to home screen.");
			}

			window.H5InstallBridge = {
				openInstall: openInstallFlow,
				isStandaloneMode: isStandaloneMode
			};

			window.addEventListener("beforeinstallprompt", function(event) {
				event.preventDefault();
				deferredInstallPrompt = event;
			});

			window.addEventListener("appinstalled", function() {
				deferredInstallPrompt = null;
			});

			if ("serviceWorker" in navigator) {
				window.addEventListener("load", function() {
					navigator.serviceWorker.register("sw.js").catch(function(err) {
						console.warn("service worker register failed", err);
					});
				});
			}

			window.addEventListener("message", function(event) {
				if (event.origin && event.origin !== window.location.origin) {
					return;
				}
				var payload = event && event.data;
				var type = (typeof payload === "string") ? payload : (payload && payload.type);
				if (type === "H5_INSTALL_OPEN") {
					openInstallFlow();
				}
			});

function SetPageTitle(title) {
    document.title = title;
}

function isMobile() {
  return /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
}

function isFullScreen() {
  return document.fullscreenElement ||
         document.webkitFullscreenElement ||
         document.mozFullScreenElement ||
         document.msFullscreenElement;
}

function resizeFrameDesktop() {
  var ww = window.innerWidth;
  var wh = window.innerHeight;
  var w = ww, h = wh;
  var wr = ww / wh;	  
  var gr = 960 / 540;
  
  if (wr > 2.2 || wr < gr)
  {
	  if (wr > gr) {
	    h = wh;
	    w = h * gr;
	  } else {
	    w = ww;
	    h = w / gr;
	  }
  }
  
  Frame.style.position = "absolute";
  Frame.style.left = 0;
  Frame.style.right = 0;
  Frame.style.top = 0;
  Frame.style.bottom = 0;
  Frame.style.margin = "auto";
  Frame.style.width = w + "px";
  Frame.style.height = h + "px";
  Frame.style.background = "#000";
  // 不再设置Frame.width/height属性
}

function resizeFrameMobile() 
{
	var orientation = window.orientation;
	//开始时调用
	if(orientation == 180 || orientation == 0 || orientation == -180)
	{
		//注意竖屏时要把 iframe的宽设置为当前窗口的高度 高设置为当前窗口的宽度
		Frame.height = window.innerWidth;
		Frame.width = window.innerHeight;
		
		//通过css样式旋转90度
		Frame.classList.add("landscape-screen");
	}
	else
	{
		//横屏时则正常
		Frame.height = window.innerHeight;
		Frame.width = window.innerWidth;
		
		//通过移除类去掉css样式
		Frame.classList.remove("landscape-screen");
	}
}

if (isMobile()) 
{
	resizeFrameMobile();
	setTimeout(resizeFrameMobile, 200);
	setTimeout(resizeFrameMobile, 400);
	setTimeout(resizeFrameMobile, 600);
			
	//监听手机旋转事件 根据旋转状态设置旋转的css样式
	window.onorientationchange = function () {
		setTimeout(resizeFrameMobile, 200);
		setTimeout(resizeFrameMobile, 400);
		setTimeout(resizeFrameMobile, 600);
    };
  	document.addEventListener('fullscreenchange', function () {
		setTimeout(resizeFrameMobile, 200);
		setTimeout(resizeFrameMobile, 400);
		setTimeout(resizeFrameMobile, 600);
    });
	document.addEventListener('visibilitychange', function() {
    try {
      if (Frame && Frame.contentWindow && typeof Frame.contentWindow.SendMessage === 'function') {
        if (document.hidden) {
          Frame.contentWindow.SendMessage('GameApp', 'PauseAllAudio');
        } else {
          Frame.contentWindow.SendMessage('GameApp', 'ResumeAllAudio');
        }
      }
    } catch (error) {
      console.warn('无法访问iframe内容，可能存在跨域限制:', error);
    }
  });
}
else
{
	// 桌面端自适应缩放
	Frame.style.background = "#000";
	resizeFrameDesktop();
	window.addEventListener('resize', resizeFrameDesktop);
	document.addEventListener('fullscreenchange', resizeFrameDesktop);
}

};

function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

let deviceId = localStorage.getItem('deviceId');
if (!deviceId) {
  deviceId = generateUUID();
  localStorage.setItem('deviceId', deviceId);
}
