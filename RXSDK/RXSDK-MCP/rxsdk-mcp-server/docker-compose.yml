services:
  mcp-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MCP_MODE=http
      - MCP_API_KEY=${MCP_API_KEY}
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
