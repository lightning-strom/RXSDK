server {
    listen 8080;
    server_name _;
    # 反向代理后使用相对重定向，避免向客户端暴露源站的 8080 端口
    absolute_redirect off;
    # 指向挂载目录内的 current 软链接，scripts/release.sh 原子切换后即时生效
    root /srv/site/current;
    index index.html;

    # 自定义 404 页面
    error_page 404 /404.html;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # 静态资源缓存（带 hash 的文件长期缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 明确处理 SPA fallback 目标；当发布目录缺少 index.html 时返回 404，
    # 避免 try_files 反复内部跳转到 /index.html 形成 500 循环。
    location = /index.html {
        try_files /index.html =404;
    }

    # 浏览器常规探测路径。项目实际 favicon 在 /img/favicon.svg。
    location = /favicon.ico {
        try_files /favicon.ico /img/favicon.svg =204;
    }

    # /docs 不带尾斜杠 → 301 到 /docs/
    location = /docs {
        return 301 /docs/;
    }

    # 更新日志路径迁移
    location = /docs/%E5%BC%80%E5%8F%91%E8%80%85%E6%96%87%E6%A1%A3/%E5%85%A5%E9%97%A8%E6%8C%87%E5%8D%97/%E6%9B%B4%E6%96%B0%E6%97%A5%E5%BF%97/JavaScript {
        return 301 /docs/changelog-javascript;
    }

    location = /docs/%E5%BC%80%E5%8F%91%E8%80%85%E6%96%87%E6%A1%A3/%E5%85%A5%E9%97%A8%E6%8C%87%E5%8D%97/%E6%9B%B4%E6%96%B0%E6%97%A5%E5%BF%97/iOS {
        return 301 /docs/changelog-ios;
    }

    location = /docs/category/%E9%B8%BF%E8%92%99 {
        return 301 /docs/changelog-harmonyos;
    }

    # /docs/ 路径：优先真实文件，找不到返回 404（避免坏链假 200）
    location /docs/ {
        try_files $uri $uri/ =404;
    }

    # 首页和其他 SPA 路由保持 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件，但允许 .well-known（ACME/AASA 等标准路径）
    location ~ /\.(?!well-known) {
        deny all;
    }
}
