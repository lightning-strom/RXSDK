plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'
apply from: "${rootDir}/maven.gradle"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "BUILD_TIME", "\"${getTimestamp()}\"")
        buildConfigField("String", "COMMIT_ID", "\"${getGitCommit()}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        packagingAAR(project, android)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(path: ':rxsdk_base')
    //注意artifactId为：ad
    api "com.transsion.game:ad:5.5.2.0"

    //下列为当前版本支持的广告源及版本-请使用指定的版本保证兼容性。
    def hs_ver = '2.9.7.2'
    def topon_ver =  '6.3.27'

    //AdMob
    api "com.anythink.sdk:adapter-admob:6.3.27"
    api "com.google.android.gms:play-services-ads:23.0.0"
    api "com.cloud.hisavana.sdk.mediation:admob-lib:$hs_ver"

    //Vungle
    api "com.anythink.sdk:adapter-vungle:$topon_ver"
    api "com.vungle:vungle-ads:7.1.0"
    api "androidx.core:core:1.3.2"
    api "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0"
    api "com.google.android.gms:play-services-basement:18.1.0"
    api "com.google.android.gms:play-services-ads-identifier:18.0.1"
    api 'com.google.ads.mediation:vungle:7.3.2.0'

    //UnityAds
    api 'com.google.ads.mediation:unity:4.11.2.0'
    api "com.anythink.sdk:adapter-unityads:$topon_ver"
    api "com.unity3d.ads:unity-ads:4.9.3"
    api "com.cloud.hisavana.sdk.mediation:unity-lib:$hs_ver"


    //Ironsource
    api 'com.google.ads.mediation:ironsource:8.0.0.1'
    api "com.anythink.sdk:adapter-ironsource:$topon_ver"
    api "com.ironsource.sdk:mediationsdk:7.9.0"
    api "com.google.android.gms:play-services-appset:16.0.2"
    api "com.google.android.gms:play-services-ads-identifier:18.0.1"
    api "com.google.android.gms:play-services-basement:18.1.0"
    api("com.cloud.hisavana.sdk.mediation:ironsource-lib:$hs_ver")


    //Pangle
    api 'com.google.ads.mediation:pangle:5.9.0.4.0'
    api "com.anythink.sdk:adapter-pangle-nonchina:6.3.27"
    api "com.pangle.global:ads-sdk:5.8.1.0"
    api "com.google.android.gms:play-services-ads-identifier:18.0.1"
    api("com.cloud.hisavana.sdk.mediation:pangle-lib:$hs_ver")

    //AppLovin
    api 'com.google.ads.mediation:applovin:12.4.3.0'
    api "com.anythink.sdk:adapter-applovin:6.3.27"
    api "com.applovin:applovin-sdk:12.3.0"
    api "com.cloud.hisavana.sdk.mediation:applovin-lib:$hs_ver"

    //Meta(facebook)
    api 'com.google.ads.mediation:facebook:6.17.0.0'
    api "com.anythink.sdk:adapter-facebook:$topon_ver"
    api "com.anythink.sdk:adapter-facebook:6.3.27.2"
    api "com.facebook.android:audience-network-sdk:6.17.0"
    api "androidx.annotation:annotation:1.0.0"
    api "com.cloud.hisavana.sdk.mediation:fan-lib:$hs_ver"

    //Mintegral
    // AnyThink overseas_sdk 已无 6.3.27，该 artifact 目前仅有 6.4.12.9（与 core 6.3.27 并存于 Transsion 指定组合）
    api 'com.google.ads.mediation:mintegral:16.7.21.0'
    api "com.anythink.sdk:adapter-mintegral-nonchina:6.4.12.9"
    api "com.mbridge.msdk.oversea:reward:16.6.51"
    api "com.mbridge.msdk.oversea:newinterstitial:16.6.51"
    api "com.mbridge.msdk.oversea:mbnative:16.6.51"
    api "com.mbridge.msdk.oversea:mbnativeadvanced:16.6.51"
    api "com.mbridge.msdk.oversea:mbsplash:16.6.51"
    api "com.mbridge.msdk.oversea:mbbanner:16.6.51"
    api "com.mbridge.msdk.oversea:mbbid:16.6.51"
    api "androidx.recyclerview:recyclerview:1.1.0"
