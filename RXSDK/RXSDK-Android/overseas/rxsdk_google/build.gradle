plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'
apply from: "${rootDir}/maven.gradle"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        // Billing Library 8.x requires API 23+.
        minSdkVersion 23
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "BUILD_TIME", "\"${getTimestamp()}\"")
        buildConfigField("String", "COMMIT_ID", "\"${getGitCommit()}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        packagingAAR(project, android)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

}

dependencies {
    api project(path: ':rxsdk_base')

    api 'com.android.billingclient:billing:8.0.0'
//    api 'com.android.billingclient:billing:7.0.0'
    api("com.google.android.gms:play-services-ads-identifier:18.1.0")
    api 'com.google.android.gms:play-services-auth:21.6.0'
    //    api 'com.android.billingclient:billing:6.0.1'
    //    api 'com.google.android.gms:play-services-auth:20.4.1'
    api 'com.google.android.play:review:2.0.2'
//    api group: 'com.google.android.gms', name: 'play-services-ads', version: '21.3.0'

    // 1.3.x 会拉高 play-services-fido → kotlin-stdlib 1.9，AGP 7.4 / R8 4.0 处理 Kotlin 元数据会失败（D8: com.android.tools.r8.kotlin.H）
    implementation "androidx.credentials:credentials:1.2.2"

    // 与当前 AGP 7.4.2 / compileSdk 34 保持兼容。1.6.x 要求 AGP 8.6+ / compileSdk 35+。
    // optional - needed for credentials support from play services, for devices running
    // Android 13 and below.
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"
}