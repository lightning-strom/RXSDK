pluginManagement {
    buildscript {
        repositories {
            maven { url "https://maven.aliyun.com/repository/google" }
            google()
            mavenCentral()
        }
        dependencies {
            // AGP 7.4.2 bundles R8/D8 4.0.52, which can crash while dexing newer
            // AndroidX artifacts such as lifecycle 2.8.x. Put a newer R8 first on
            // the buildscript classpath without changing the AGP version.
            classpath("com.android.tools:r8:8.3.37")
        }
    }
}

rootProject.name = "rxsdk-android"

// local_repo：自动 include 所有含 build.gradle 的子目录，新增 AAR 无需改 settings.gradle
file("local_repo").listFiles()?.each { f ->
    if (f.isDirectory() && new File(f, "build.gradle").exists()) {
        include ":local_repo:${f.name}"
    }
}

