plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'
apply from: "${rootDir}/maven.gradle"



android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "BUILD_TIME", "\"${getTimestamp()}\"")
        buildConfigField("String", "COMMIT_ID", "\"${getGitCommit()}\"")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        packagingAAR(project, android)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst('lib/*/libw.so')
        pickFirst('lib/*/libc++_shared.so')
        pickFirst('lib/*/libkwsgmain.so')
        pickFirst('lib/*/libksse.so')
        pickFirst('lib/*/libweconvert.so')
        pickFirst('lib/*/libYTFaceReflect.so')
        pickFirst('lib/*/libYTNextCV.so')
    }

}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    api project(path: ':rxsdk_base')
    //noinspection GradleDependency
    implementation libs.appcompat
//    implementation 'com.android.support:appcompat-v7:26.1.0'

    //noinspection GradleDependency
//    api libs.gson
    api('com.kwai.sdk:kwaisdk-base-buy:1.4.3.213')
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
//    api('com.kwai.sdk:kwaisdk-base:1.4.1-154')
    api('com.google.guava:guava:24.0-android')
    //noinspection GradleDependency
    api 'com.alipay.sdk:AlipaySdk:15.8.01.20210112203525'

