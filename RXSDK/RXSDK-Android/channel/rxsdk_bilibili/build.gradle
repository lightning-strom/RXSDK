plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'
apply from: "${rootDir}/maven.gradle"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion


    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "BUILD_TIME", "\"${getTimestamp()}\"")
        buildConfigField("String", "COMMIT_ID", "\"${getGitCommit()}\"")
//        ndk {
//            abiFilters 'armeabi-v7a', 'x86'
//        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        packagingAAR(project, android)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    testImplementation libs.junit
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.espresso.core

    //noinspection GradleDependency
    implementation libs.appcompat

    //noinspection Aligned16KB
    api 'com.gsc.pub:gsc_android_library:5.9.2'
//    api 'com.base.socializelib:socialize:1.0.10'
    api 'com.base.oaid:game-oaid:2.0.1'
    api 'com.bun.miitmdid:oaid_sdk:2.5.1'
    //noinspection GradleDependency
    implementation 'com.alipay.sdk:alipaysdk-android:15.8.11'

    api (project(path: ':rxsdk_weixin')) {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }
}