plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'
apply from: "${rootDir}/maven.gradle"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField("String", "BUILD_TIME", "\"${getTimestamp()}\"")
        buildConfigField("String", "COMMIT_ID", "\"${getGitCommit()}\"")
    }

    buildTypes {
        release {
            aaptOptions {
                ignoreAssetsPattern '!supplierconfig.json:'
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        packagingAAR(project, android)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

}

dependencies {

//    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

//    noinspection Aligned16KB
    implementation 'com.brsdk.android.df:brsdk:9.4.1'
    implementation 'com.xut.sdk.channel:sdk-core:1.1.0'
    implementation 'com.xut.sdk.channel:xuteng:1.1.0'

    implementation("com.brsdk.android:providers-toutiao:1.1.0")
    implementation("com.bytedance.applog:RangersAppLog-Lite-cn:6.14.3") {
        exclude group: "org.jetbrains.kotlin"
    }
    implementation('com.bytedance.applog.convert:RangersAppLog-All-convert:6.14.3')


    api project(path: ':rxsdk_base')
    api (project(path: ':rxsdk_base_ui')){
        exclude group: "org.jetbrains.kotlin"
    }

    testImplementation libs.junit
}
