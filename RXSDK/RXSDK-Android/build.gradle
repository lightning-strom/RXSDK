/**
 * 在 com.android.library / application 插件应用后立刻写入 android.namespace（与 Manifest 的 package 一致）。
 * 必须在 AGP 读 Manifest 的「弃用 package」告警之前设置，仅靠 afterEvaluate 往往仍会打日志。
 * 若 `src/main/AndroidManifest.xml` 未声明 package，则跳过（由模块 build.gradle 显式写 namespace，如 rxsdk_apkpure）。
 */
def applyNamespaceFromMainManifest = { Project prj ->
    def androidExt = prj.extensions.findByName('android')
    if (androidExt == null) {
        return
    }
    if (androidExt.hasProperty('namespace')) {
        def cur = androidExt.namespace
        if (cur != null && cur.toString().trim()) {
            return
        }
    }
    def manifestFile = prj.file('src/main/AndroidManifest.xml')
    if (!manifestFile.exists()) {
        return
    }
    def manifestPkg = new XmlSlurper(false, false).parse(manifestFile).'@package'?.text()
    if (manifestPkg == null || !manifestPkg.toString().trim()) {
        return
    }
    androidExt.namespace = manifestPkg.toString().trim()
}

// 为 Android 子项目统一配置单元测试：报告与日志
subprojects { sub ->
    // Kotlin 1.8 起 jdk7/jdk8 扩展已并入 stdlib。若生命周期/协程等传递依赖仍保留
    // 1.6.x 的 jdk7/jdk8，而图中同时解析出 1.8.x stdlib，会在 D8 阶段产生重复类。
    // 与 buildscript.kotlin_version 对齐，确保所有 Android 宿主使用同一套 Kotlin 标准库。
    sub.configurations.configureEach {
        resolutionStrategy.force(
                "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlin_version}",
                "org.jetbrains.kotlin:kotlin-stdlib-common:${rootProject.ext.kotlin_version}",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlin_version}",
                "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlin_version}"
        )
    }
    sub.plugins.withId('com.android.library') {
        applyNamespaceFromMainManifest(sub)
    }
    sub.plugins.withId('com.android.application') {
        applyNamespaceFromMainManifest(sub)
    }
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin('com.android.library') || sub.plugins.hasPlugin('com.android.application')) {
            if (sub.android != null) {
                sub.android {
                    compileOptions {
                        // RuStore SDK（BOM 2026.x / pay 10.x）为 Java 17 字节码，须 javac17+ 才可编译该模块；
                        // 其余模块仍为 11（避免此前 R8/字节码形态问题）。
                        if (sub.path == ':overseas:rxsdk_rustore' || sub.path == ':overseas:rxsdk_vk') {
                            sourceCompatibility JavaVersion.VERSION_17
                            targetCompatibility JavaVersion.VERSION_17
                        } else {
                            sourceCompatibility JavaVersion.VERSION_11
                            targetCompatibility JavaVersion.VERSION_11
                        }
                    }
                    if (hasProperty('kotlinOptions')) {
                        kotlinOptions {
                            jvmTarget = (sub.path == ':overseas:rxsdk_rustore' || sub.path == ':overseas:rxsdk_vk') ? "17" : "11"
                        }
                    }
                    buildFeatures {
                        buildConfig = true
                    }
                    testOptions {
                        unitTests {
                            includeAndroidResources = false
                            all {
                                testLogging {
                                    events "passed", "skipped", "failed"
                                    exceptionFormat "full"
                                    showStandardStreams = false
                                }
                            }
                        }
                    }
                }
                sub.tasks.withType(JavaCompile).configureEach { t ->
                    if (t.options?.compilerArgs != null) {
                        t.options.compilerArgs.removeAll { it == '-Werror' || it == '-Xlint:all,-options' }
                    }
                }
            }
        }
    }
}

// 一键发布所有 local_repo 下的 AAR（阿里云 / Nexus 二选一或都跑）
gradle.projectsEvaluated {
    def localRepos = subprojects.findAll { it.path.startsWith(':local_repo:') }
    tasks.register('publishAllLocalRepo') {
        group = 'publishing'
        description = 'Publish all local_repo AARs to 阿里云 (REPO_URL_RELEASE)'
        dependsOn localRepos.collect { it.tasks.findByName('publishReleasePublicationToAliRepository') }.findAll { it != null }
    }
    tasks.register('publishAllLocalRepoToNexus') {
        group = 'publishing'
        description = 'Publish all local_repo AARs to Nexus (NEXUS_RELEASE_URL)'
        dependsOn localRepos.collect { it.tasks.findByName('publishReleasePublicationToNexusRepository') }.findAll { it != null }
    }
    tasks.register('publishAllLocalRepoBoth') {
        group = 'publishing'
        description = 'Publish all local_repo AARs to 阿里云 + Nexus'
        dependsOn tasks.named('publishAllLocalRepo'), tasks.named('publishAllLocalRepoToNexus')
    }
}

