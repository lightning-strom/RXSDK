material = "1.9.0"
constraintlayout = "2.1.2"

# 公共基础库
gson = "2.8.8"
glide = "4.13.2"
okhttp = "3.12.1"
zxing = "3.5.3"
json-test = "20231013"

# Firebase
firebase-bom = "33.7.0"
play-services-ads-identifier = "18.2.0"
firebase-messaging-directboot = "24.1.0"

# 华为 HMS
hms-hwid = "6.12.0.300"
hms-iap = "6.13.0.300"
