plugins {
    id 'com.android.library'
}
//apply from :'ysdk_self_check.gradle'
project.group 'com.ruixue'


android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation project(':channel:rxsdk_ysdk')
    implementation project(':rxsdk_base')
    implementation project(':rxsdk_base_ui')
    implementation( project(':rxsdk_weixin')){
        exclude group : 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
    }
    implementation 'com.nex3z:flow-layout:1.3.3'

    implementation libs.appcompat
//    implementation libs.material
    implementation libs.constraintlayout

}
