}

class IntentFilter {
    List<String> categories = new ArrayList<String>()
    List<String> actions = new ArrayList<String>()
    List<String> datas = new ArrayList<String>()

    @Override
    String toString() {
        def sb = new StringBuilder();
        sb.append("categories = ").append(Arrays.toString(categories)).append(" , ")
                .append("actions = ").append(Arrays.toString(actions)).append(" , ")
                .append("datas = ").append(Arrays.toString(datas))
        return sb.toString()
    }
}

class Provider {
    String name
    String authorities
    String exported = "false"
}

abstract class Task {
    String name
    Object obj

    abstract String check()

    boolean isEmpty(String str) {
        return str == null || str == ""
    }
}

class ModuleTask extends Task {

    List<Task> tasks = new ArrayList<>()

    @Override
    String check() {
        def sb = new StringBuilder()
        for (task in tasks) {
            String res = task.check()
            if (!isEmpty(res)) {
                sb.append(res).append("\r\n")
            }
        }
        def res = sb.toString()
        if (isEmpty(res)) {
            res = name + "自检没有发现异常."
        }
        return res
    }

}

class ActivityCheckTask extends Task {
    String configChanges
    String screenOrientation
    String launchMode
    String data

    @Override
    String check() {
        def sb = new StringBuilder()
        if (obj instanceof Activity) {
            if (!isEmpty(screenOrientation) && !obj.screenOrientation.equals(screenOrientation)) {
                sb.append(obj.name).append("的configChanges应该配置为")
                        .append(screenOrientation)
                        .append(" , 当前值为").append(obj.screenOrientation)
                        .append("\r\n")
            }

            if (!isEmpty(configChanges)) {
                def configs = obj.configChanges.split("\\|")
                def set = new HashSet<String>()
                configs.each { it ->
                    set.add(it)
                }

                def taskConfigs = configChanges.split("\\|")

                for (configChange in taskConfigs) {
                    if (!set.contains(configChange)) {
                        sb.append(obj.name).append("的configChanges应该配置为")
                                .append(configChanges)
                                .append(" , 当前值为").append(obj.configChanges)
                                .append("\r\n")
                        break
                    }
                }
            }

            if (!isEmpty(launchMode) && !obj.launchMode.equals(launchMode)) {
                sb.append(obj.name).append("的launchMode应该配置为").append(launchMode).append("\r\n")
            }

            if (!isEmpty(data)) {
                if (obj.filters.size() == 0) {
                    sb.append(obj.name).append("需要设置intent-filter,具体参照这个网址：")
                } else {
                    for (filter in obj.filters) {
                        for (da in filter.datas) {
                            if (!da.equals(data)) {
                                sb.append(obj.name).append("的intent-filter的data的scheme设置不正确，期望值是")
                                        .append(data).append(" , 现值为")
                                        .append(da)
                                break
                            }
                        }
                    }
                }
            }

        } else {
            sb.append("需要在manifest中配置").append(name)
        }
        return sb.toString()
    }
}

class PermissionCheckTask extends Task {

    List<String> permissions = new ArrayList<>()

    @Override
    String check() {
        def sb = new StringBuilder()
        if (obj instanceof HashSet) {
            for (permission in permissions) {
                if (!obj.contains(permission)) {
                    sb.append("需要在manifest上配置").append(permission).append("\r\n")
                }
            }
        }
        return sb.toString()
    }
}

class ProviderCheckTask extends Task {

    List<Provider> providers = new ArrayList<>()

    @Override
    String check() {
        def sb = new StringBuilder()
        if (obj instanceof HashMap) {
            for (pro in providers) {
                if (!obj.containsKey(pro.name)) {
                    sb.append("需要在manifest上配置").append(pro.name).append("\r\n")
                } else {
                    def cachePro = obj.get(pro.name)

                    if (cachePro instanceof Provider) {
                        if (!cachePro.authorities.equals(pro.authorities)) {
                            sb.append(pro.name).append("的authorities期望值为").append(pro.authorities)
                                    .append("， 当前值为").append(cachePro.authorities).append("\r\n")
                        }

                        if (cachePro.exported.equals(pro.exported)) {
                            sb.append(pro.name).append("的exported期望值为").append(pro.exported)
                                    .append("， 当前值为").append(cachePro.exported).append("\r\n")
                        }
                    }

                }
            }
        }
        return sb.toString()
    }

}