        def sb = new StringBuilder()
        sb.append("name = ").append(name).append(" , ")
                .append("configChanges = ").append(configChanges).append(" , ")
                .append("screenOrientation = ").append(screenOrientation).append(" , ")
                .append("launchMode = ").append(launchMode).append(" , ")
                .append(Arrays.toString(filters))
        println sb.toString()
