ActivityCheckTask generateActivityCheckTask(String name, String launchMode, String data,
                                            String configChanges, String screenOrientation) {
    def task = new ActivityCheckTask()
    task.name = name
    task.obj = activityMap.get(task.name)
    task.configChanges = configChanges
    task.launchMode = launchMode
    task.data = data
    task.screenOrientation = screenOrientation
    return task
}

PermissionCheckTask generatePermissionCheckTask(String name, List<String> permissions) {
    def task = new PermissionCheckTask()
    task.name = name
    task.obj = userPermission
    task.permissions = permissions
    return task
}

ProviderCheckTask generateProviderCheckTask(String name, List<Provider> providers) {
    ProviderCheckTask task = new ProviderCheckTask()
    task.providers = providers
    task.name = name
    task.obj = providerMap
    return task
}

//获取包名
String getPackageName(Node node) {
    return node.attributes().package
}

//获取manifest上的权限列表
Set<String> getUserPermission(Node node) {
    def userPermissions = new HashSet<String>()
    node["uses-permission"].forEach { userPermission ->
        def permission = userPermission.attributes().get("android:name")
        if (!isEmpty(permission)) {
            userPermissions.add(permission)
        }
    }
    return userPermissions
}

//获取activity列表
Map<String, Activity> getActivities(Node node) {
    def map = new HashMap<String, Activity>()
    node.application[0].activity.forEach { act ->
        def name = act.attributes().get("android:name")
        if (!isEmpty(name)) {
            parseActivity(act, name, map)
        }
    }

    return map
}

def parseActivity(Node act, String name, Map<String, Activity> map) {
    Activity activity = new Activity()
    if (name.startsWith(".")) {
        name = packageName + name
    }
    activity.name = name
    activity.configChanges = act.attributes().get(ANDROID_CONFIG_CHANGES)
    activity.screenOrientation = act.attributes().get(ANDROID_SCREEN_ORIENTATION)
    activity.launchMode = act.attributes().get(ANDROID_LAUNCH)
    parseIntentFilter(act, activity)
    map.put(activity.name, activity)
}

def parseIntentFilter(Node act, Activity activity) {
    act["intent-filter"].forEach { it ->
        def filter = new IntentFilter()
        it["data"].forEach { data ->
            def d = data.attributes().get(ANDROID_SCHEME)
            if (!isEmpty(d)) {
                filter.datas.add(d)
            }
        }
        it["action"].forEach { action ->
            def a = action.attributes().get(ANDROID_NAME)
            if (!isEmpty(a)) {
                filter.actions.add(a)
            }
        }
        it["category"].forEach { category ->
            def c = category.attributes().get(ANDROID_NAME)
            if (!isEmpty(c)) {
                filter.categories.add(c)
            }
        }
        activity.filters.add(filter)
    }
}

Map<String, Provider> getProviderMap(Node node) {
    def map = new HashMap<String, Provider>()
    node.application[0].provider.forEach { pro ->
        def name = pro.attributes().get("android:name")
        if (!isEmpty(name)) {
            parseProvider(pro, name, map)
        }
    }
    return map
}

def parseProvider(Node node, String name, Map<String, Provider> map) {
    Provider provider = new Provider()
    provider.name = name
    provider.exported = node.attributes().get("android:exported")
    provider.authorities = node.attributes().get("android:authorities")
    map.put(provider.name, provider)
}

static boolean isEmpty(String str) {
    return str == null || str == ""
}

static def printNormal(String msg) {
    System.out.println(msg)
}

static def printYellow(String msg) {
    System.out.println("\033[32;4m" + msg + "\033[0m")
}

def printRed(String msg) {
    System.out.println("\033[31;4m" + msg + "\033[0m")
}

class Activity {
