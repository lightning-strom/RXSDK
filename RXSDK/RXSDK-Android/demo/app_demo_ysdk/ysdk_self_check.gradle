//检查初始化
task ysdkcheck() {
    printYellow("---------------  ysdk开始配置自检  ---------------\r\n\r\n")
    //检查初试配置
    checkInitConf(ysdkconf_path, manifest_path, qq_app_id, wx_app_id)
    //解析并加载manifest
    loadManifest(manifestFile)
    //解析配置文件
    checkYsdkConf(confFile)
    //模块自检
    checkAndGenerateResult()
}

boolean isReleaseBuildType() {
    for (String s : gradle.startParameter.taskNames) {
        if (s.contains("Release") | s.contains("release")) {
            return true
        }
    }
    return false
}

def checkInitConf(String ysdkConfPath, String manifestPath, String qqId, String wxId) {
    def conf = new File(ysdkConfPath)
    if (!conf.exists()) {
        throw new RuntimeException(ysdkConfPath+"文件不存在！！请检查配置的路径是否正确！！")
    }
    confFile = conf
    def manifest = new File(manifestPath)
    if (!manifest.exists()) {
        throw new RuntimeException(manifestPath+"文件不存在！！请检查配置的路径是否正确！！")
    }
    manifestFile = manifest

    qqAppid = qqId
    wxAppid = wxId
}

def loadManifest(File manifestFile) {
    def manifestContent = manifestFile.getText()
    Node node = new XmlParser(false, false).parseText(manifestContent)

    packageName = getPackageName(node)
    if (isEmpty(packageName)) {
        throw new RuntimeException("没有找到对应的包名！！")
    }
    ACT_NAME_WX_ACTIVITY = "com.tencent.ysdk.module.user.impl.wx.YSDKWXEntryActivity"
    userPermission = getUserPermission(node)
    activityMap = getActivities(node)
    providerMap = getProviderMap(node)
}

def checkYsdkConf(File file) {
    String line
    file.withReader { reader ->
        while ((line = reader.readLine()) != null) {
            if (!line.startsWith(";")) {
                def conf = line.trim().split("=")
                if (conf != null && confKeyList.contains(conf[0])) {
                    configMap[conf[0]] = conf[1]
                }
            }
        }
    }

    checkAppId(QQ_APP_ID, qqAppid, configMap.get(QQ_APP_ID))
    checkAppId(WX_APP_ID, wxAppid, configMap.get(WX_APP_ID))

}

def checkAppId(String type, String source, String conf) {
    if (isEmpty(source) && isEmpty(conf)) return
    if (isEmpty(source) || isEmpty(conf)) {
        throw new RuntimeException("脚本上配置的" + type + "需要与ysdkconf.ini上配置的相同！！ 脚本上的appId为"
                + source + " , ysdkconf.ini上的appId为" + conf)
    }
    if (!source.equals(conf)) {
        throw new RuntimeException("脚本上配置的" + type + "需要与ysdkconf.ini上配置的相同！！ 脚本上的appId为"
                + source + " , ysdkconf.ini上的appId为" + conf)
    }
}

