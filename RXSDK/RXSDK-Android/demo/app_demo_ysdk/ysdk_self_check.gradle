String checkCommonModule() {
    printYellow("--->   ysdk标准接入模块开始自检\r\n")
    String res = null
    def task = new ModuleTask()
    task.name = "ysdk标准模块自检"
    def permissions = new ArrayList<String>()
    permissions.add(PERMISSION_ACCESS_NETWORK_STATE)
    permissions.add(PERMISSION_ACCESS_WIFI_STATE)
    permissions.add(PERMISSION_INTERNET)
    permissions.add(PERMISSION_READ_PHONE_STATE)
    def permissionTask = generatePermissionCheckTask(task.name, permissions)
    task.tasks.add(permissionTask)
    res = task.check()
    printYellow("ysdk标准接入模块自检结束    <---\r\n")
    return res
}

