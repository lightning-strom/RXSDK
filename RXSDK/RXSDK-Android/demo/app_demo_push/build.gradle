plugins {
    id 'com.android.library'
}
project.group 'com.ruixue'


android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation project(':rxsdk_base')
    implementation project(':rxsdk_base_ui')
    implementation(project(':rxsdk_weixin')) {
        exclude group: 'com.tencent.mm.opensdk', module: 'wechat-sdk-android'
    }

    implementation project(':push:rxsdk_push_base')
    compileOnly project(':push:rxsdk_push_huawei')
    compileOnly project(':push:rxsdk_push_meizu')
    compileOnly project(':push:rxsdk_push_mi')
    compileOnly project(':push:rxsdk_push_oppo')
    compileOnly project(':push:rxsdk_push_vivo')

    api project(':demo:app_rxsdk_demo')

    implementation 'com.nex3z:flow-layout:1.3.3'

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout


}
