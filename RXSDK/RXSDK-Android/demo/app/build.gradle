plugins {
    id 'com.android.application'
}

def buildTask = getGradle().getStartParameter().getTaskNames().toString().toLowerCase()
if (buildTask.contains("overseas")) {
    println("Task  apply plugin:`com.google.gms.google-services` " + buildTask)
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'

//    apply plugin: 'com.huawei.agconnect'
}
if (buildTask.contains("huawei")) {
//    println("Task    " + buildTask)
    apply plugin: 'com.huawei.agconnect'
}


android {
    compileSdkVersion rootProject.ext.compileSdkVersion
//    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion '23.1.7779620'

    defaultConfig {
        // rxsdk_overseas 传递依赖 rxsdk_google；Billing 8.x 要求宿主 API 23+。
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 30
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName


        applicationId "com.weile.doudizhu.ld"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        ndk {
////            abiFilters "armeabi"//,,"armeabi-v7a", "arm64-v8a""armeabi", "x86", "mips"
//            abiFilters "armeabi-v7a", "arm64-v8a"//,"armeabi", "x86", "mips"
//        }

        //字节游戏联运接入文档 v2.0.5.2配置
        multiDexEnabled false
        //字节游戏联运接入埋点数据实时验证功能，如果不需要可以填其他值，比如应用包名，详见以下文档：https://datarangers.com.cn/help/doc?lid=2230&did=45237
        manifestPlaceholders.put("APPLOG_SCHEME", "union_game")

        manifestPlaceholders = ["AMAP_APIKEY": "please set key in productFlavors"]
        flavorDimensions "versionCode"
    }

    buildTypes {

        release {
            // 不显示Log
            buildConfigField "boolean", "LOG_DEBUG", "false"

            //混淆
            minifyEnabled false
            //Zipalign优化
            zipAlignEnabled true
            // 移除无用的resource文件
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

        }
        debug {

            //混淆
            minifyEnabled false
            //Zipalign优化
            zipAlignEnabled true
            // 移除无用的resource文件
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig null //使用Flavors签名

        }

    }

