dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation libs.appcompat
    implementation libs.constraintlayout


//    implementation project(path: ':rxsdk_bugly')
    implementation(project(path: ':demo:app_rxsdk_demo')) {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    }

}

configurations {
    all*.exclude group: 'com.google.guava', module: 'listenablefuture'
//    all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp'
//    all*.exclude group: 'com.google.code.gson', module: 'gson'
}


def ldFlavorPrefixes = ['wl_ddz_ld', 'leidian']
configurations.configureEach { cfg ->
    if (ldFlavorPrefixes.any { cfg.name.startsWith(it) }) {
        cfg.exclude group: 'com.google.code.gson', module: 'gson'
        cfg.exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        cfg.exclude group: 'com.squareup.okio', module: 'okio'
    }
}
