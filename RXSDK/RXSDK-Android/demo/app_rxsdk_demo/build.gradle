plugins {
    id 'com.android.library'
}
apply plugin: 'kotlin-android'
project.group 'com.ruixue'


android {
    compileSdkVersion rootProject.ext.compileSdkVersion


    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        flavorDimensions "versionCode"


    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation (project(':rxsdk_base_ui'))
    implementation (project(':rxsdk_feedback_ui'))
    implementation (project(':rxsdk_gdt'))

    implementation 'com.nex3z:flow-layout:1.3.3'
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation libs.material
    // 单元测试
    testImplementation 'junit:junit:4.13.2'

    // Android 测试
    androidTestImplementation libs.test.ext.junit
    androidTestImplementation libs.espresso.core

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    implementation libs.navigation.fragment
    implementation libs.navigation.ui


    implementation 'com.journeyapps:zxing-android-embedded:3.4.0'
    debugImplementation 'com.didichuxing.doraemonkit:doraemonkit:1.1.8'
    releaseImplementation 'com.didichuxing.doraemonkit:doraemonkit-no-op:1.1.8'
    //butterknife @BindView绑定布局AndroidX使用
    implementation 'com.jakewharton:butterknife:10.1.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.1.0'


}
repositories {
    mavenCentral()
}