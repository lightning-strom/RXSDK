plugins {
    id 'com.android.application'

}

project.group 'com.ruixue'


android {
    signingConfigs {
        byweilegame {
            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../app/keystore/weileGlobal.keystore")
            storePassword "577588599"
        }
        zhadanji {
            keyAlias "jxmzone"
            keyPassword "577588599"
            storeFile file("../app/keystore/jxmzone.keystore")
            storePassword "577588599"
        }
    }

    compileSdkVersion rootProject.ext.compileSdkVersion
//    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.weile.bombchicken"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion 33 //rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.0.14"

        signingConfig signingConfigs.zhadanji


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation libs.appcompat
    implementation libs.constraintlayout

    implementation 'com.nex3z:flow-layout:1.3.3'

    implementation project(path: ':overseas:rxsdk_overseas_weizhi')
