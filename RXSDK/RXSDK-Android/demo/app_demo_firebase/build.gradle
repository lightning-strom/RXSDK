plugins {
    id 'com.android.application'
    id 'com.google.firebase.crashlytics'
    id 'com.google.gms.google-services'
}

project.group 'com.ruixue'


android {

    signingConfigs {
        byweilegame {
            keyAlias "weilegame"
            keyPassword "577588599"
            storeFile file("../app/keystore/weileGlobal.keystore")
            storePassword "577588599"
        }
    }

    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion '21.3.6528147'
    defaultConfig {
        applicationId "com.ruixue.demo.firebase"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

//        signingConfig signingConfigs.byweilegame

        manifestPlaceholders.put("FACEBOOK_APP_ID", "7472805502731255")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation libs.appcompat
    implementation libs.constraintlayout

    implementation 'com.nex3z:flow-layout:1.3.3'
    implementation 'org.greenrobot:eventbus:3.3.1'

    api project(path: ':overseas:rxsdk_overseas')
    api project(path: ':overseas:rxsdk_firebase')
}